name: R2 live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-object:
    name: R2 object and public access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-smoke
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - name: Verify disposable R2 object
        run: uv run python scripts/smoke_r2.py
