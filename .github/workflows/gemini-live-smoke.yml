name: Gemini live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-tts:
    name: Gemini two-speaker TTS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-smoke
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --dev
      - name: Render and validate synthetic conversation
        run: |
          mkdir -p "${RUNNER_TEMP}/gemini-smoke"
          uv run python scripts/smoke_gemini.py \
            --output "${RUNNER_TEMP}/gemini-smoke/sample.wav"
      - name: Upload short-lived sample
        uses: actions/upload-artifact@v4
        with:
          name: gemini-two-speaker-smoke
          path: ${{ runner.temp }}/gemini-smoke
          retention-days: 1
          if-no-files-found: error
